name: viberglass-e2e

services:
  postgres:
    image: postgres:16-alpine
    container_name: viberglass-e2e-postgres
    environment:
      POSTGRES_DB: viberglass-e2e
      POSTGRES_USER: viberglass
      POSTGRES_PASSWORD: viberglass
    ports:
      - "5433:5432"
    # No volume: every `up` after `down` starts from an empty database.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viberglass -d viberglass-e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
