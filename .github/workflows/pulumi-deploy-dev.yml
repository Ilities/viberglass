# Pulumi Dev Deployment Workflow
# Deploys infrastructure changes to dev on merge to main: base, workers, then
# platform. State is in the S3 backend (infra/README.md).

name: Pulumi Deploy (Dev)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/base/**'
      - 'infra/platform/**'
      - 'infra/workers/*.ts'
      - 'infra/workers/package.json'
      - 'infra/workers/Pulumi*.yaml'
      - '.github/workflows/pulumi-deploy-dev.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pulumi-deploy-dev
  cancel-in-progress: false

env:
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL || 's3://viberglass-pulumi-state' }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

jobs:
  deploy:
    name: Deploy Infrastructure to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v3

      # The platform stack's config holds account-specific values and isn't committed.
      - name: Write platform stack config
        env:
          STACK_CONFIG: ${{ secrets.PULUMI_PLATFORM_CONFIG_DEV }}
        run: |
          if [ -z "$STACK_CONFIG" ]; then
            echo "::error::Set the PULUMI_PLATFORM_CONFIG_DEV secret to the contents of infra/platform/Pulumi.dev.yaml"
            exit 1
          fi
          printf '%s\n' "$STACK_CONFIG" > infra/platform/Pulumi.dev.yaml

      # Base first: workers and platform read its outputs. Platform reads the workers stack's.
      - name: Install base dependencies
        working-directory: infra/base
        run: npm install --no-audit --no-fund

      - name: Pulumi up (base)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra/base
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          diff: true

      - name: Install workers dependencies
        working-directory: infra/workers
        run: npm install --no-audit --no-fund

      - name: Pulumi up (workers)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra/workers
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          diff: true

      - name: Install platform dependencies
        working-directory: infra/platform
        run: npm install --no-audit --no-fund

      - name: Pulumi up (platform)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra/platform
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          diff: true
