# Publishes the App space images to GHCR: the runtime apps run on and the
# builder release builds run in, for linux/amd64 and linux/arm64. Both come
# from one Dockerfile so they share a base.
name: Publish App Images (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/apps/**'
      - 'apps/viberator/**'
      - 'packages/agent-core/**'
      - 'packages/agents/**'
      - 'packages/telemetry/**'
      - 'packages/types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-app-images.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, builder]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/viberglass-app-${{ matrix.target }}-node" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/apps/docker/app-node.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=viberglass-app-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=viberglass-app-${{ matrix.target }}-${{ matrix.arch }}

  manifests:
    name: Tag ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, builder]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join architectures and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/viberglass-app-${{ matrix.target }}-node"
          tags=(-t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest")
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(-t "$IMAGE:$RELEASE_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$GITHUB_SHA-amd64" \
            "$IMAGE:$GITHUB_SHA-arm64"
