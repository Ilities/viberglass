# viberglass Development Environment
# One-command local development: docker compose up
#
# This compose file starts all services (postgres, backend, frontend)
# with proper dependency ordering, health checks, and hot-reload support.
#
# Usage:
#   docker compose up -d          # Start all services in background
#   docker compose up             # Start all services with logs
#   docker compose down           # Stop and remove containers
#   docker compose ps             # Show running services
#   docker compose logs backend   # Show backend logs
#
# Port Conflicts:
# If you have PostgreSQL already running on the host, you may see
# "port is already allocated" errors. Options:
#   1. Stop the host service temporarily: sudo systemctl stop postgresql
#   2. Change the host port mapping below (e.g., "5433:5432" for postgres)
#   3. Remove the ports section entirely (services still accessible within Docker network)

networks:
  viberglass-dev-network:
    name: viberglass-dev-network

volumes:
  postgres-data:
    name: viberglass-postgres-data
  langfuse-postgres-data:
    name: viberglass-langfuse-postgres-data
  langfuse-clickhouse-data:
    name: viberglass-langfuse-clickhouse-data
  langfuse-clickhouse-logs:
    name: viberglass-langfuse-clickhouse-logs
  langfuse-minio-data:
    name: viberglass-langfuse-minio-data

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: viberglass-dev-postgres
    environment:
      POSTGRES_DB: viberglass-platform
      POSTGRES_USER: jussi
      POSTGRES_PASSWORD: salasana
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jussi -d viberglass-platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/platform-backend/Dockerfile.dev
    container_name: viberglass-dev-backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: viberglass-platform
      DB_USER: jussi
      DB_PASSWORD: salasana
      POSTGRES_DB: viberglass-platform
      POSTGRES_USER: jussi
      POSTGRES_PASSWORD: salasana
      RUN_MIGRATIONS_ON_STARTUP: "true"
      # Node
      NODE_ENV: development
      PORT: 8888
      LOG_LEVEL: debug
      # Ticket media local storage (used by Docker clanker file mounts)
      TICKET_MEDIA_DISK_ROOT: /tmp/viberglass-ticket-media
      TICKET_MEDIA_CONTAINER_ROOT: /tmp/viberglass-ticket-media
      SECRETS_ENCRYPTION_KEY: 'very-berry-secret-key'
      WEBHOOK_SECRET_ENCRYPTION_KEY: 'very-berry-webhook-key'
      SESSION_STATE_ROOT: /tmp/viberglass-session-state
      PLATFORM_FRONTEND_URL: http://localhost:3000
      # Where pre-built worker images come from (publish-worker-images.yml). Runners
      # without an explicit image pull `<registry>/viberator-worker-<agent>:latest`.
      # Set it empty to use images built locally under their bare names instead.
      VIBERATOR_WORKER_REGISTRY: ${VIBERATOR_WORKER_REGISTRY-ghcr.io/ilities}
      # OpenTelemetry. Empty means unset; tracing is off unless one is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Replaces the endpoint above when forwarding OTEL_* into worker containers,
      # which run on a bridge network and cannot resolve compose service names.
      WORKER_OTEL_EXPORTER_OTLP_ENDPOINT: ${WORKER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-}
      # Prints spans to stdout. Enables tracing on its own — no collector needed.
      VIBERGLASS_OTEL_CONSOLE: ${VIBERGLASS_OTEL_CONSOLE:-}
      VIBERGLASS_DEPLOYMENT_ENV: ${VIBERGLASS_DEPLOYMENT_ENV:-development}
      # Ships prompts and completions (ticket bodies, repo source) to the collector.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-}
      # Hot-reload in containers (required for some Docker setups)
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8888:8888"
    volumes:
      # Mount source with cached mode for better performance on macOS/Windows
      - ./apps/platform-backend:/app/apps/platform-backend:cached
      - ./packages/types:/app/packages/types:cached
      - ./packages/telemetry:/app/packages/telemetry:cached
      - ./packages/chat-slack:/app/packages/chat-slack:cached
      - ./packages/integration-core:/app/packages/integration-core:cached
      - ./packages/platform-ui:/app/packages/platform-ui:cached
      - ./packages/mcp-server:/app/packages/mcp-server:cached
      - ./packages/integrations:/app/packages/integrations:cached
      # Persist ticket media files on host disk for Docker strategy mounts
      - /tmp/viberglass-ticket-media:/tmp/viberglass-ticket-media
      # Persist session state archives for local conversation continuity
      - /tmp/viberglass-session-state:/tmp/viberglass-session-state
      # Persist clanker instruction files in repo (survives container restarts)
      - ./.clanker-instructions:/app/apps/platform-backend/.clanker-instructions
      # Docker socket for provisioning clanker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Worker Dockerfiles and source needed for clanker provisioning
      - ./infra:/app/infra:cached
      - ./apps/viberator:/app/apps/viberator:cached
      - ./packages/agent-core:/app/packages/agent-core:cached
      - ./packages/agents:/app/packages/agents:cached
      # Root package files needed for workspace-aware Docker builds
      - ./package.json:/app/package.json:cached
      - ./package-lock.json:/app/package-lock.json:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  # Frontend (Vite + React)
  frontend:
    build:
      context: .
      dockerfile: apps/platform-frontend/Dockerfile.dev
    container_name: viberglass-dev-frontend
    environment:
      # Backend API URL (from host perspective)
      VITE_API_URL: http://localhost:8888
      NODE_ENV: development
      # Hot-reload in containers
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      # Mount source with cached mode for better performance
      - ./apps/platform-frontend:/app/apps/platform-frontend:cached
      # Note: packages/types is NOT mounted — image-built dist/ is used directly.
      # Rebuild image when types change: docker compose build frontend
    depends_on:
      backend:
        condition: service_started
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  # Optional OTLP trace backend. Gated behind the `langfuse` profile:
  #   docker compose --profile langfuse up -d      (setup: docs/telemetry-local.md)
  # Credentials below are localhost-only dev values.

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: viberglass-dev-langfuse-web
    profiles: ["langfuse"]
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      # Remapped: the frontend already owns 3000 on the host.
      - "3001:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: "eCFkap12IetWxPKdsLUDw4DiuYNi99MX"
      ENCRYPTION_KEY: "bce084cb90460c5987633b397f9751410f2601057b9779b670392948200f308a"
      NEXTAUTH_SECRET: "/LWuCyOu95ZQUQ0Z7Bv8iRcoy2StMnKW"
      NEXTAUTH_URL: http://localhost:3001
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      # Seeded on first boot, so the API keys are fixed and onboarding is skipped.
      LANGFUSE_INIT_ORG_ID: viberglass-dev
      LANGFUSE_INIT_ORG_NAME: Viberglass Dev
      LANGFUSE_INIT_PROJECT_ID: viberglass-dev
      LANGFUSE_INIT_PROJECT_NAME: Viberglass
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-viberglass-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-viberglass-dev
      LANGFUSE_INIT_USER_EMAIL: dev@viberglass.local
      LANGFUSE_INIT_USER_NAME: Viberglass Dev
      LANGFUSE_INIT_USER_PASSWORD: langfuse-dev
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: viberglass-dev-langfuse-worker
    profiles: ["langfuse"]
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment: *langfuse-env
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: viberglass-dev-langfuse-postgres
    profiles: ["langfuse"]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    # No host port: 5432 belongs to the platform database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: viberglass-dev-langfuse-clickhouse
    profiles: ["langfuse"]
    environment:
      # Do not add CLICKHOUSE_SKIP_USER_SETUP: it skips creating this user and
      # Langfuse migrations then fail with code 516.
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  langfuse-minio:
    # Not docker.io/minio/minio — that repo 404s.
    image: cgr.dev/chainguard/minio
    container_name: viberglass-dev-langfuse-minio
    profiles: ["langfuse"]
    entrypoint: sh
    # Creates the bucket on first boot; Langfuse does not create it itself.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - langfuse-minio-data:/data
    networks:
      - viberglass-dev-network
    restart: unless-stopped

  langfuse-redis:
    image: redis:7-alpine
    container_name: viberglass-dev-langfuse-redis
    profiles: ["langfuse"]
    command: --requirepass langfuse
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - viberglass-dev-network
    restart: unless-stopped
