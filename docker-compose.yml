# Viberglass on your own machine, from the published images.
#
#   docker compose up -d
#
# Then open http://localhost:3000. Upgrade with `docker compose pull && docker compose up -d`.
#
# The passwords and keys below are fixed, so every port is bound to this machine only.
# Don't change that: for an installation others reach, use docker-compose.prod.yml.
# Setup: docs/guide/admin/install-docker.md. To work on Viberglass itself, see
# docker-compose.dev.yml.

name: viberglass-local

volumes:
  postgres-data:
  storage-data:

networks:
  default:
  # Agent containers join this network to reach the backend and object storage.
  # The database isn't on it.
  workers:
    name: viberglass-workers

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: viberglass
      POSTGRES_USER: viberglass
      POSTGRES_PASSWORD: viberglass-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viberglass -d viberglass"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # S3-compatible storage for Files spaces, task media and plan documents.
  storage:
    # Not docker.io/minio/minio — that repo 404s.
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    # Creates the bucket on first boot.
    command: -c 'mkdir -p /data/viberglass && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: viberglass
      MINIO_ROOT_PASSWORD: viberglass-local
    ports:
      # Browsers download task media and files from here.
      - "127.0.0.1:${VIBERGLASS_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${VIBERGLASS_STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - storage-data:/data
    networks:
      - default
      - workers
    restart: unless-stopped

  backend:
    image: ${VIBERGLASS_REGISTRY:-ghcr.io/ilities}/viberglass-backend:${VIBERGLASS_VERSION:-latest}
    # Starting agent containers needs the Docker socket, which only root can use
    # in this image.
    user: root
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: "true"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: viberglass
      DB_USER: viberglass
      DB_PASSWORD: viberglass-local
      DB_SSL: "false"
      SECRETS_ENCRYPTION_KEY: viberglass-local-secrets-key
      WEBHOOK_SECRET_ENCRYPTION_KEY: viberglass-local-webhook-key
      PLATFORM_FRONTEND_URL: http://localhost:${VIBERGLASS_HTTP_PORT:-3000}
      PLATFORM_PUBLIC_API_URL: http://localhost:${VIBERGLASS_HTTP_PORT:-3000}
      ALLOWED_ORIGINS: http://localhost:${VIBERGLASS_HTTP_PORT:-3000}
      # Agent containers run on the workers network and call the backend there.
      VIBERATOR_WORKER_NETWORK: viberglass-workers
      PLATFORM_API_URL: http://backend:3000
      VIBERATOR_WORKER_REGISTRY: ${VIBERATOR_WORKER_REGISTRY-ghcr.io/ilities}
      VIBERATOR_WORKER_IMAGE_TAG: ${VIBERATOR_WORKER_IMAGE_TAG:-latest}
      # The backend and the agent containers it starts see these folders at the same
      # path, because the Docker daemon mounts them from this machine.
      TICKET_MEDIA_DISK_ROOT: ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}/media
      TICKET_MEDIA_CONTAINER_ROOT: ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}/media
      SESSION_STATE_ROOT: ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}/session-state
      CLANKER_INSTRUCTION_FILES_ROOT: ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}/instructions
      SKILL_FILES_ROOT: ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}/skills
      # Artifact previews, served from 127.0.0.1 rather than localhost so the app's
      # cookies never reach them.
      PREVIEW_PORT: 8890
      PREVIEW_PUBLIC_URL: http://127.0.0.1:${VIBERGLASS_PREVIEW_PORT:-8890}
      S3_BUCKET: viberglass
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${VIBERGLASS_STORAGE_PORT:-9000}
      S3_WORKER_ENDPOINT: http://storage:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: viberglass
      S3_SECRET_ACCESS_KEY: viberglass-local
      # Optional: email and traces, from a .env file next to this one. Empty means off.
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      WORKER_OTEL_EXPORTER_OTLP_ENDPOINT: ${WORKER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      VIBERGLASS_DEPLOYMENT_ENV: local
    ports:
      - "127.0.0.1:${VIBERGLASS_PREVIEW_PORT:-8890}:8890"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}:${VIBERGLASS_DATA_DIR:-${HOME}/.viberglass}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - default
      - workers
    restart: unless-stopped

  # Serves the app and passes /api to the backend.
  frontend:
    image: ${VIBERGLASS_REGISTRY:-ghcr.io/ilities}/viberglass-frontend:${VIBERGLASS_VERSION:-latest}
    environment:
      BACKEND_UPSTREAM: backend:3000
    ports:
      - "127.0.0.1:${VIBERGLASS_HTTP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # Catches everything the backend emails; read it at http://localhost:8025.
  # Started only with `docker compose --profile mail up -d`.
  mailpit:
    image: axllent/mailpit:v1
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
