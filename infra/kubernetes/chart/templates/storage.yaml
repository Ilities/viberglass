{{- if .Values.storage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "viberglass.name" . }}-minio
spec:
  selector: {app: "{{ include "viberglass.name" . }}-minio"}
  ports: [{port: 9000, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "viberglass.name" . }}-minio
spec:
  serviceName: {{ include "viberglass.name" . }}-minio
  replicas: 1
  selector:
    matchLabels: {app: "{{ include "viberglass.name" . }}-minio"}
  template:
    metadata:
      labels: {app: "{{ include "viberglass.name" . }}-minio"}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: {{ .Values.storage.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.storageSecret }}, key: S3_ACCESS_KEY_ID}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.storageSecret }}, key: S3_SECRET_ACCESS_KEY}}
          ports: [{name: http, containerPort: 9000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: http}}
          livenessProbe: {httpGet: {path: /minio/health/live, port: http}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.storage.size | quote }}}}
{{- end }}
