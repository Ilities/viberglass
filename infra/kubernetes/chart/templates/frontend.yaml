apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "viberglass.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: "{{ include "viberglass.name" . }}-frontend"}
  template:
    metadata:
      labels: {app: "{{ include "viberglass.name" . }}-frontend"}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: {{ required "frontend.image is required" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env: [{name: BACKEND_UPSTREAM, value: "{{ include "viberglass.name" . }}-backend:3000"}]
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "viberglass.name" . }}-frontend
spec:
  selector: {app: "{{ include "viberglass.name" . }}-frontend"}
  ports: [{port: 80, targetPort: http}]
