apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "viberglass.workersNamespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "viberglass.name" . }}-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "viberglass.name" . }}-jobs
  namespace: {{ include "viberglass.workersNamespace" . }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "viberglass.name" . }}-jobs
  namespace: {{ include "viberglass.workersNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "viberglass.name" . }}-backend
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "viberglass.name" . }}-jobs
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "viberglass.name" . }}-workers
  namespace: {{ include "viberglass.workersNamespace" . }}
spec:
  hard:
    {{- toYaml .Values.workers.quota | nindent 4 }}
{{- if .Values.apps.domain }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "viberglass.appsNamespace" . }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "viberglass.name" . }}-apps
  namespace: {{ include "viberglass.appsNamespace" . }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, update, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "viberglass.name" . }}-apps
  namespace: {{ include "viberglass.appsNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "viberglass.name" . }}-backend
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "viberglass.name" . }}-apps
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "viberglass.name" . }}-apps
  namespace: {{ include "viberglass.appsNamespace" . }}
spec:
  hard:
    {{- toYaml .Values.apps.quota | nindent 4 }}
{{- end }}
