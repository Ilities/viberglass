apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "viberglass.workersNamespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "viberglass.name" . }}-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "viberglass.name" . }}-jobs
  namespace: {{ include "viberglass.workersNamespace" . }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "viberglass.name" . }}-jobs
  namespace: {{ include "viberglass.workersNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "viberglass.name" . }}-backend
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "viberglass.name" . }}-jobs
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "viberglass.name" . }}-workers
  namespace: {{ include "viberglass.workersNamespace" . }}
spec:
  hard:
    {{- toYaml .Values.workers.quota | nindent 4 }}
