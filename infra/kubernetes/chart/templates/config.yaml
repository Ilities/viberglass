apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "viberglass.name" . }}-config
data:
  NODE_ENV: production
  PORT: "3000"
  AUTH_ENABLED: "true"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  DB_HOST: {{ include "viberglass.databaseHost" . | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_SSL: {{ .Values.database.ssl | quote }}
  S3_ENDPOINT: {{ include "viberglass.storageEndpoint" . | quote }}
  S3_PUBLIC_ENDPOINT: {{ default (include "viberglass.storageEndpoint" .) .Values.storage.publicEndpoint | quote }}
  S3_REGION: {{ .Values.storage.region | quote }}
  S3_BUCKET: {{ .Values.storage.bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.storage.forcePathStyle | quote }}
  KUBERNETES_WORKER_NAMESPACE: {{ include "viberglass.workersNamespace" . | quote }}
  KUBERNETES_WORKER_ENV_SECRET: {{ .Values.workers.envSecret | quote }}
  PLATFORM_API_URL: "http://{{ include "viberglass.name" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:3000"
  PLATFORM_PUBLIC_API_URL: {{ .Values.publicUrl | quote }}
  PLATFORM_FRONTEND_URL: {{ .Values.publicUrl | quote }}
  ALLOWED_ORIGINS: {{ .Values.publicUrl | quote }}
  VIBERATOR_WORKER_REGISTRY: {{ .Values.workers.registry | quote }}
  KUBERNETES_WORKER_IMAGE_PULL_SECRETS: {{ join "," .Values.workers.imagePullSecrets | quote }}
  KUBERNETES_WORKER_IMAGE_TAG: {{ .Values.workers.imageTag | quote }}
  MIGRATION_MARKER: {{ .Values.migration.marker | quote }}
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "viberglass.name" . }}-bootstrap
data:
  wait.cjs: |
    const { Client } = require('pg');
    const mode = process.argv[2];
    async function wait() {
      for (let attempt = 0; attempt < 150; attempt++) {
        const client = new Client({ host: process.env.DB_HOST, port: process.env.DB_PORT, user: process.env.DB_USER,
          password: process.env.DB_PASSWORD, database: process.env.DB_NAME,
          ssl: process.env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false });
        try {
          await client.connect();
          const result = await client.query(mode === 'database' ? 'SELECT 1' : 'SELECT name FROM kysely_migration WHERE name = $1',
            mode === 'database' ? [] : [process.env.MIGRATION_MARKER]);
          if (result.rows.length) return;
        } catch { console.log('Waiting for ' + mode); }
        finally { await client.end(); }
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
      throw new Error('Timed out waiting for ' + mode);
    }
    wait().catch(error => { console.error(error.message); process.exitCode = 1; });
  bucket.cjs: |
    const { S3Client, HeadBucketCommand, CreateBucketCommand } = require('@aws-sdk/client-s3');
    const s3 = new S3Client({ endpoint: process.env.S3_ENDPOINT, region: process.env.S3_REGION, forcePathStyle: true,
      credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } });
    async function create() {
      for (let attempt = 0; attempt < 90; attempt++) {
        try {
          try { await s3.send(new HeadBucketCommand({ Bucket: process.env.S3_BUCKET })); }
          catch (error) {
            if (error.$metadata?.httpStatusCode !== 404) throw error;
            await s3.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }));
          }
          return;
        } catch { await new Promise(resolve => setTimeout(resolve, 2000)); }
      }
      throw new Error('Could not initialize local object storage bucket');
    }
    create().catch(error => { console.error(error.message); process.exitCode = 1; }).finally(() => s3.destroy());
