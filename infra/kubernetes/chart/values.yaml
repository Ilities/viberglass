backend:
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  env: {}
frontend:
  image: ""
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
imagePullPolicy: IfNotPresent
imagePullSecrets: []
appSecret: viberglass-app
storageSecret: viberglass-storage
publicUrl: https://viberglass.example.com
workers:
  namespace: ""
  registry: ghcr.io/ilities
  imageTag: latest
  imagePullSecrets: []
  envSecret: ""
  quota:
    pods: "10"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.ephemeral-storage: 40Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    count/jobs.batch: "100"
database:
  enabled: false
  image: postgres:17-alpine
  host: ""
  port: 5432
  name: viberglass
  user: viberglass
  ssl: true
  storage: 5Gi
  storageClass: ""
storage:
  enabled: false
  image: cgr.dev/chainguard/minio:latest
  endpoint: ""
  publicEndpoint: ""
  region: us-east-1
  bucket: viberglass
  forcePathStyle: false
  workerEndpoint: ""
  size: 5Gi
  storageClass: ""
preview:
  publicUrl: ""
demo:
  enabled: false
  # Seeds the demo again every night from a fixture bundle; see apps/platform-backend/src/demo/README.md.
  reset:
    enabled: false
    schedule: "30 3 * * *"
    timeZone: UTC
    # The bundle, in a bucket the instance's storage credentials can read.
    fixtures:
      bucket: viberglass-demo-fixtures
      prefix: ""
    # A Secret with the shared viewer's `email` and `password`.
    viewerSecret: viberglass-demo-viewer
    # The seeder holds the whole bundle in memory; its heap must fit the limit.
    seed:
      heapMb: 2560
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: "1", memory: 3Gi}
    # Where the reset reaches the Kubernetes API; narrow to the API server's address where it's known.
    apiServer:
      cidrs: ["0.0.0.0/0"]
      ports: [443, 6443]
apps:
  domain: ""
  publicUrl: ""
  namespace: ""
  storageClass: ""
  keepPreviewsOn: false
  imagePullSecrets: []
  quota:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 12Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "50"
    limits.cpu: "20"
    limits.memory: 12Gi
  extraEgress: []
ingress:
  enabled: false
  className: ""
  host: viberglass.example.com
  annotations: {}
  tls: []
networkPolicy:
  enabled: true
  workerExtraEgress: []
